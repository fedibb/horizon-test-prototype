[pytest]
# Pytest configuration for Horizon Test

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for traceability
markers =
    codebeamer: Tests linked to Codebeamer requirements
    esim: eSIM profile tests
    network: Network registration tests
    high_priority: High priority tests
    medium_priority: Medium priority tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --color=yes

# Test paths
testpaths = tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage (optional)
# --cov=generator
# --cov-report=html
